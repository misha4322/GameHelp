version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gamehelp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: drizzel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "6872"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: gamehelp-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local